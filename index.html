<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Koi Pond</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040c10;
      font-family: "DejaVu Sans Mono", "Liberation Mono", "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
      -webkit-user-select: none;
    }
    #pond-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      background: #040c10;
    }
  </style>
</head>
<body>
  <canvas id="pond-canvas" aria-label="Interactive ASCII Koi Pond"></canvas>
  <script src="./pond.js"></script>
</body>
</html>
